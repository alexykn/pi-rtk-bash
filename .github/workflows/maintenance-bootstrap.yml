name: Maintenance bootstrap

on:
  push:
    branches: [feat/code-previews-maintenance]

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate the integration lockfile
        run: npm install
      - name: Check the integration
        run: npm run check
      - name: Install RTK 0.50.0
        env:
          RTK_SHA256: bc2b8902b0d9c796c82ef45f16ae2307e17757afeca5ee156235a3dc7bda5f89
        run: |
          curl --fail --location --output "$RUNNER_TEMP/rtk.tar.gz" https://github.com/rtk-ai/rtk/releases/download/v0.50.0/rtk-x86_64-unknown-linux-musl.tar.gz
          echo "$RTK_SHA256  $RUNNER_TEMP/rtk.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/rtk-bin"
          tar -xzf "$RUNNER_TEMP/rtk.tar.gz" -C "$RUNNER_TEMP/rtk-bin"
          echo "$RUNNER_TEMP/rtk-bin" >> "$GITHUB_PATH"
      - name: Test current RTK compatibility
        run: npm run test:rtk
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Preserve generated dependency manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-manifests
          path: |
            package.json
            package-lock.json
